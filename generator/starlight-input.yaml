# generator/starlight-input.yaml
#
# ジェネレーターの入力。generator/load_input.py が読み込み、
# generator/assemble.py が呼び出す。2026-09-20時点でカバーしているのは
# 建物・道路色・注記(Anno)のtext-color/text-font、および被覆面3層のうち
# 色だけをpalette化したpatch(background以外)——全123レイヤーの網羅では
# なく、ADR([0018](../docs/decisions/0018-road-color-not-flat-category-compiler.md)、
# [0020](../docs/decisions/0020-yaml-wiring-stage1.md))で確認済みの範囲。
#
# 設計方針(このコメント自体もAI向けの構造化コメント):
#   - palette: 生のrgba値は1箇所にしか書かない。他は全てここへの参照にする。
#     Starlightの配色磨き上げは、理想的には主にこのセクションを触るだけで
#     済むようにしたい——これが「リテラル保持でYAMLを貧相にしない」ための核。
#   - categories / priority_chains: docs/decisions/0018で確認済みの2つの
#     コンパイラ形状。「値の対応表」だけがYAMLのデータで、「どの順番で
#     判定するか」という構造(match全体の形、caseの入れ子)はコード側
#     (generator/*.py)が持つ。構造までYAMLに落とすと、単なるJSONの
#     入れ子表現になり、可読性もAI可読性も上がらないため。
#   - layers: tier_template.pyが展開する14ロールのうち、色を持つものだけ
#     抜粋。塗り/色をcategories・priority_chainsに配線する。
#   - patches: 「リテラル保持」層。生JSONを埋め込まず、bvmap-dark.jsonの
#     該当レイヤーをbaseとして、①なぜliteralか ②既知パターンが未解明の
#     まま残っているか ③色だけpalette参照に差し替える、の3点だけを書く。
#   - hosting: bvmap-dark.jsonから継承せず上書きするトップレベルのスタイル
#     プロパティ(glyphs/sprite)。値が定まっていない間はそのキー自体を
#     省略し、GSI原本の値を素通しする(assemble.py参照)。

palette:
  # 各トークンの由来(ADR参照)をコメントに残す。「なぜこの値か」を将来の
  # AIセッションが情報源を再度掘り返さずに済むように。
  gray_100: "rgba(113,114,116,1)"  # 62レイヤー横断の汎用色。単独の意味を持たない(0010 §4)
  gray_157: "rgba(164,166,168,1)"  # vt_motorway==1 / 高速自動車国道等(0018)
  gray_160: "rgba(167,169,171,1)"  # 国道(0018)
  gray_226: "rgba(227,229,231,1)"  # 都道府県道(0018)
  gray_173: "rgba(179,180,183,1)"  # 幅員ランプ: vt_code in [2721,2722,2723]、および3m-5.5m未満例外(0018)
  gray_200: "rgba(204,205,207,1)"  # 幅員ランプ: vt_code in [2731,2732,2733](0018)
  gray_255: "rgba(255,255,255,1)"  # 幅員ランプdefault、および行政区画の白(被覆面の抜き)
  gray_233: "rgba(234,235,237,1)"  # 普通建物 塗り(0010 §2)
  gray_203: "rgba(206,208,210,1)"  # 堅ろう建物/無壁舎 塗り(0010 §2)
  gray_152: "rgba(160,161,163,1)"  # 高層建物 塗り(0010 §2)
  gray_164: "rgba(171,172,174,1)"  # 建物 輪郭、種別によらず一律(0010 §2)
  gray_209: "rgba(212,213,215,1)"  # 水域(WA)塗り。背景(zoom4-8)と偶然同値(0010 §4)
  transparent: "rgba(0,0,0,0)"
  # 注記(Anno)の重要度ランプ(0008、8+1段階)。他のカテゴリと値が重複しない
  # 専用の濃淡なので、gray_*と別名にして混同を避ける。
  anno_29: "rgba(34,36,38,1)"
  anno_98: "rgba(101,103,105,1)"
  anno_70: "rgba(74,76,78,1)"
  anno_68: "rgba(72,74,76,1)"
  anno_80: "rgba(84,85,87,1)"
  anno_42: "rgba(47,48,51,1)"
  anno_59: "rgba(64,65,67,1)"
  anno_50: "rgba(55,56,58,1)"
  black: "rgba(0,0,0,1)"
  # gray_88/gray_161は、Anno重要度ランプのgroup_b/c7352(vt_code 7372/7352)と、
  # 独立した等深線数値部/等高線数値部シンボルレイヤーの両方で使われている、
  # 意図的に揃えられた値([0022](../docs/decisions/0022-zl4-10-and-post-tier-layers-footprint.md)
  # で発見)——だからanno_*ではなくgray_*に付け直した(Anno専用ではないため)。
  gray_88: "rgba(92,93,95,1)"
  gray_161: "rgba(168,169,172,1)"
  # 鉄道トンネル・軌道(0025)。
  gray_113: "rgba(124,126,128,1)"  # 鉄道トンネル本体、地下鉄
  gray_30: "rgba(35,37,39,1)"  # 軌道(RailTrCL)、普通鉄道/特殊鉄道/路面の鉄道
  # 陸水面・被覆面付随の線群(0008のクラスタ、0032のGroup A/B/D/E)専用。
  # 生の値はgray_88と偶然同じだが、[0033](../docs/decisions/0033-new-token-policy.md)の
  # 方針により独立トークンにした——このクラスタ内(水涯線・水部構造物線・
  # 海岸線・河川中心線・地形表記線)で共有し、Anno側のgray_88とは連動させない。
  gray_88_hydro: "rgba(92,93,95,1)"
  gray_150: "rgba(158,159,162,1)"  # 特定地区界(0032のGroup C)。他トークンと非衝突

categories:
  building_fill:
    engine: flat_match  # 0018: 単一プロパティのフラット表引き
    groups:
      c3101: {codes: [3101], value: gray_233}
      c3102: {codes: [3102], value: gray_203}
      c3103: {codes: [3103], value: gray_152}
      c3111: {codes: [3111], value: gray_203}
      c3112: {codes: [3112], value: gray_203}
    default: transparent

  building_outline_color:
    engine: flat_match
    groups:
      c3101: {codes: [3101], value: gray_164}
      c3102: {codes: [3102], value: gray_164}
      c3103: {codes: [3103], value: gray_164}
      c3111: {codes: [3111], value: gray_164}
      c3112: {codes: [3112], value: gray_164}
    default: transparent

  building_outline_width:
    engine: flat_match
    value_type: number  # not a color — matched or not, 1px or 0 (0010 §2)
    groups:
      c3101: {codes: [3101], value: 1}
      c3102: {codes: [3102], value: 1}
      c3103: {codes: [3103], value: 1}
      c3111: {codes: [3111], value: 1}
      c3112: {codes: [3112], value: 1}
    default: 0

  # 構造物3層(0022)。building_fill/outlineと全く同じ「vt_codeフラット
  # match」の形——建物とは別テーブルだが、同じコンパイラで再現できる。
  structure_fill:
    engine: flat_match
    groups:
      c4301: {codes: [4301], value: gray_152}
      c4302: {codes: [4302], value: gray_233}
    default: transparent

  structure_line:
    engine: flat_match
    groups:
      c4201: {codes: [4201], value: black}
      c4202: {codes: [4202], value: gray_100}
    default: transparent

  # ZL4-10鉄道(0024)。vt_codeではなくvt_rtcode(鉄道種別)で分岐する唯一の
  # flat_matchカテゴリ——"codes"はvt_rtcodeの文字列値(vt_codeの整数では
  # ない)を指す。property: vt_rtcodeが実際に配線されて初めて意味を持つ
  # フィールド(0020の指摘#6で一度削除した未使用フィールドとは違う)。
  zl410_rail_color:
    engine: flat_match
    property: vt_rtcode
    groups:
      subway: {codes: ["地下鉄"], value: gray_161}
    default: gray_100

  # 鉄道トンネル・ククリ(casing)。本体と違い、defaultは単純な値なので
  # flat_matchでそのまま表現できる(0025)。
  rail_tunnel_kukuri_color:
    engine: flat_match
    property: vt_rtcode
    groups:
      subway: {codes: ["地下鉄"], value: gray_255}
    default: gray_100

  # 軌道(RailTrCL、0025)。表層/トンネルで暗くなる種別(普通鉄道/特殊鉄道/
  # 路面の鉄道)は完全に一致する——vt_codeの実際の値集合が違うだけ。
  railtr_surface_color:
    engine: flat_match
    groups:
      dark: {codes: [2801, 2803, 2806, 2811, 2813, 2816, 2831, 2833, 2836], value: gray_30}
    default: gray_100

  railtr_tunnel_color:
    engine: flat_match
    groups:
      dark: {codes: [2802, 2804, 2812, 2814, 2832, 2834], value: gray_30}
    default: gray_100

  anno_text_color:
    engine: flat_match
    # 名前は仮(GSI公式名ではない、category_table.pyのコメント参照)。
    groups:
      c521: {codes: [521], value: anno_29}
      c348: {codes: [348], value: anno_98}
      group_a: {codes: [411, 412, 413, 421, 422, 423, 431, 432, 441, 860, 2941, 2942, 2943, 2944, 2945], value: anno_70}
      group_b: {codes: [7372, 7711], value: gray_88}
      c7352: {codes: [7352], value: gray_161}
      group_c: {codes: [2901, 2903, 2904], value: gray_255}
      # 注意: text-fontのwater_coastal(下記)とはvt_codeの範囲が異なる
      # (8コード vs 11コード、0017で確認済み)。同じ「水域・海岸」という
      # 概念でも、プロパティごとに実際のメンバーシップが違う。
      water_coastal: {codes: [321, 322, 341, 344, 345, 820, 840, 841], value: anno_68}
      c220: {codes: [220], value: anno_80}
      c312: {codes: [312], value: anno_42}
      group_d: {codes: [333, 346], value: anno_59}
      group_e:
        codes: [511, 522, 523, 531, 532, 534, 611, 612, 613, 614, 615, 621, 623, 631, 632, 633,
                634, 641, 642, 651, 652, 653, 654, 661, 662, 671, 672, 673, 681, 720, 730, 870,
                880, 881, 882, 883, 884, 885, 886, 887, 888, 889, 890, 899, 999, 3201, 3202,
                3203, 3204, 3205, 3206, 3211, 3212, 3213, 3214, 3215, 3216, 3217, 3218, 3221,
                3231, 3232, 3241, 3242, 3243, 3244]
        value: anno_50
    default: black

  anno_text_font:
    engine: flat_match
    value_type: font_literal  # 値はcompile_match_expression()に["literal",[name]]として渡す
    groups:
      # text-colorのwater_coastal(上記)より3コード多い(342/347/842、海岸・
      # 浜・半島系)——フォントでは明朝体扱いだが、色ではdefault(黒)に落ちる
      # (0017で確認済み)。
      # 値はstars.optgeo.org自前配信のフォント名(Martinがフォント内部の
      # 名前で命名するため、GSI原文の"NotoSerifJP-SemiBold"/"NotoSansJP-
      # Regular"とは表記が異なる。書体・ウェイトは同一、0036参照)。
      water_coastal: {codes: [321, 322, 341, 342, 344, 345, 347, 820, 840, 841, 842], value: "Noto Serif JP SemiBold"}
    default: "Noto Sans JP Regular"

  # bvmap-注記道路番号(0027)。当初「共有パターン無し」と誤分類していたが、
  # 実際はただの小さいflat_match(vt_code 7701=水面標高だけ黒、それ以外の
  # 経路番号系は白)。
  anno_road_number_color:
    engine: flat_match
    groups:
      c7701: {codes: [7701], value: black}
    default: gray_255

priority_chains:
  road_color:
    engine: priority_case_chain  # 0018: 複数プロパティにまたがる優先順位付きcase連鎖
    # 判定の順序・入れ子構造はgenerator/road_color.pyが持つ。ここではその
    # 構造が参照するパラメータだけを宣言する。
    bridge_vt_codes: [2704, 2714]
    bridge_table:  # vt_rdctg -> palette。alpha 0.5固定はコード側の責務
      国道: gray_160
      都道府県道: gray_226
      市区町村道等: gray_100
      高速自動車国道等: gray_157
      その他: gray_100
      不明: gray_100
    bridge_default: gray_100
    general_table:  # 一般道でvt_rdctg単独で色分けされる3カテゴリのみ(0018)
      国道: gray_160
      都道府県道: gray_226
      高速自動車国道等: gray_157
    motorway_color: gray_157
    width_ramp:  # 一般道のdefaultが落ちる先(vt_rnkwidth/vt_code駆動、0018)
      "2721,2722,2723": gray_173
      "2731,2732,2733": gray_200
    width_ramp_default: gray_255
    narrow_exception_color: gray_173  # zoom<14限定、vt_rnkwidth=="3m-5.5m未満"(0018)

  # ZL4-10(z<11概観)の道路色。tierのroad_colorとは独立したテーブル
  # (0022/0024)——bridge_vt_codesが広い、都道府県道の値が違う、
  # 「国道,主要道路」というグループキーがある、幅員ランプが先・
  # motorway/rdctg判定が後という逆順のネスト。構造はgenerator/
  # zl410_road_color.compile_kokudo_color()が持つ。
  zl410_kokudo_road_color:
    engine: priority_case_chain
    bridge_vt_codes: [2704, 2714, 2724, 2734]
    bridge_table:
      "国道,主要道路": gray_160
      都道府県道: gray_100
      市区町村道等: gray_100
      高速自動車国道等: gray_157
      その他: gray_100
      不明: gray_100
    bridge_default: gray_100
    general_table:
      "国道,主要道路": gray_160
      都道府県道: gray_226
      高速自動車国道等: gray_157
    general_default: gray_255
    motorway_color: gray_157
    width_ramp:
      "2721,2722,2723": gray_173
      "2731,2732,2733": gray_255  # NOTE: tierの同じvt_codeバケットはgray_200(0018)——ZL4-10は別値

  # ZL4-10の高速道路専用レイヤー。filterがvt_rdctg=="高速自動車国道等"に
  # 絞られているため、vt_motorwayの再チェックが無い(0024の推測)。構造は
  # generator/zl410_road_color.compile_kousoku_color()が持つ。
  zl410_kosoku_road_color:
    engine: priority_case_chain
    bridge_vt_codes: [2704, 2714, 2724, 2734]
    bridge_table:
      国道: gray_160
      都道府県道: gray_226
      市区町村道等: gray_100
      高速自動車国道等: gray_157
      その他: gray_100
      不明: gray_100
    bridge_default: gray_100
    general_table:
      国道: gray_160
      都道府県道: gray_226
      市区町村道等: gray_255
      高速自動車国道等: gray_157
      その他: gray_255
      不明: gray_255
    general_default: gray_255
    width_ramp:
      "2721,2722,2723": gray_173
      "2731,2732,2733": gray_255

  # 鉄道トンネル本体(0025)。defaultの枝がcase(vt_sngldbl)を含む入れ子——
  # flat_matchでは表現できないため、priority_chainsに置く(名前が示す通り
  # 「優先順位付き」ではないが、構造がコード側にあるという点は同じ)。
  # 構造はgenerator/rail_tunnel_color.compile_main_color()が持つ。
  rail_tunnel_main_color:
    engine: nested_match
    subway_color: gray_113
    station_color: gray_173
    default_color: gray_100

  # 注記(Anno)のシンボル付き2層(0017/0027)。共有ランプ(categories.
  # anno_text_color)をbase_categoryとして丸ごと再利用し、ズーム14を境に
  # 指定したvt_codeだけ透明にする——構造はgenerator/anno_symbol_color.
  # compile_symbol_text_color()が持つ。値(どのvt_codeを消すか)は
  # パレット参照ではなく生のvt_codeリスト(色ではないため)。
  anno_symbol_text_color_100_over:
    engine: nested_match
    base_category: anno_text_color
    hide_below_zoom14: [661, 662]
    hide_at_zoom14: [3201, 3204, 3215, 3216, 3217, 3218, 3243]

  anno_symbol_text_color_100_under:
    engine: nested_match
    base_category: anno_text_color
    hide_below_zoom14: [631, 632, 633, 6368, 6376]
    hide_at_zoom14: [3212, 3213, 3214]

layers:
  # tier_template.pyの14ロールのうち、色を持つものだけ抜粋。tierとfilterの
  # 機械的展開はコード側(generator/tier_template.py)の仕事。
  - role: 道路中心線色
    engine: tier_template
    paint:
      line-color: {from: priority_chains.road_color}
  - role: 建築物
    engine: tier_template
    paint:
      fill-color: {from: categories.building_fill}
  - role: 建築物の外周線
    engine: tier_template
    paint:
      line-color: {from: categories.building_outline_color}

  # tier構造の外にある独立レイヤー(0022)。engine: standaloneは、baseを
  # bvmap-dark.jsonからそのままコピーし、指定したpaintプロパティだけ
  # categoriesの生成結果に差し替える(tier_templateのようなtier展開は
  # 行わない、1レイヤー1回きりの配線)。
  - id: bvmap-構造物面
    engine: standalone
    paint:
      fill-color: {from: categories.structure_fill}
  - id: bvmap-構造物線
    engine: standalone
    paint:
      line-color: {from: categories.structure_line}

  # ZL4-10(0022/0024)。3層とも独自テーブルなので、道路2層は
  # priority_chains、鉄道1層はcategoriesと、それぞれ別の仕組みから配線
  # される——tier構造の道路色/建物と同じ「エンジンの再利用」だが、
  # パラメータは完全に別物。
  - id: bvmap-道路中心線ZL4-10国道
    engine: standalone
    paint:
      line-color: {from: priority_chains.zl410_kokudo_road_color}
  - id: bvmap-道路中心線ZL4-10高速
    engine: standalone
    paint:
      line-color: {from: priority_chains.zl410_kosoku_road_color}
  - id: bvmap-鉄道中心線ZL4-10
    engine: standalone
    paint:
      line-color: {from: categories.zl410_rail_color}

  # 鉄道トンネル・軌道(0025)。
  - id: bvmap-鉄道中心線地下トンネルククリ
    engine: standalone
    paint:
      line-color: {from: categories.rail_tunnel_kukuri_color}
  - id: bvmap-鉄道中心線地下トンネル
    engine: standalone
    paint:
      line-color: {from: priority_chains.rail_tunnel_main_color}
  - id: bvmap-軌道の中心線
    engine: standalone
    paint:
      line-color: {from: categories.railtr_surface_color}
  - id: bvmap-軌道の中心線トンネル
    engine: standalone
    paint:
      line-color: {from: categories.railtr_tunnel_color}

patches:
  # 「リテラル保持」層。生JSONは埋め込まず、bvmap-dark.jsonの該当レイヤーを
  # baseにして、①なぜliteralか ②既知パターン未解明フラグ ③色のpalette化、
  # の3点だけをここに書く。値はbvmap-dark.jsonから実際に読み取って検証済み
  # (2026-09-20)。color_overridesはトップレベルのpaintプロパティへの代入
  # のみ対応(generator/load_input.py参照)。
  - id: bvmap-行政区画
    base: {source: style/bvmap-dark.json, layer: bvmap-行政区画}
    literal_reason: >
      被覆面。塗りは白一色で「未描画」に近い(行政区画そのものを見せる層で
      はなく、背景の反転ダンスの一部)。単独のvt_code分岐を持たないため、
      compiled化するテーブルが存在しない。
    known_pattern_pending: true
    known_pattern_note: >
      background / bvmap-水域 と3層で「小縮尺は背景色、大縮尺はWAを描画」
      という分業をしている(セッション内で確認済み、未ADR化)。将来この
      3層をセットで1つの「被覆面ダンス」コンポーネントとして括り出す余地
      がある。
    color_overrides:
      fill-color: gray_255

  - id: bvmap-水域
    base: {source: style/bvmap-dark.json, layer: bvmap-水域}
    literal_reason: >
      被覆面。fill-opacityのinterpolate/case構造(zoom<11でvt_code 5201系
      =河川湖池を間引く、0008で検証済み)は単独ロジックで他レイヤーと
      共有されない。
    known_pattern_pending: true
    known_pattern_note: "bvmap-行政区画と同じ「被覆面ダンス」の一部。"
    color_overrides:
      fill-color: gray_209

  - id: background
    base: {source: style/bvmap-dark.json, layer: background}
    literal_reason: "背景単色のstep。行政区画/水域との3層ダンスの一部。"
    known_pattern_pending: true
