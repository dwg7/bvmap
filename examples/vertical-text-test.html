<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bvmap-spacegray — 縦書き棒音符テスト</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute;
    z-index: 10;
    top: 12px;
    left: 12px;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.6;
  }
  .panel button {
    display: block;
    width: 100%;
    margin: 2px 0;
    padding: 4px 10px;
    text-align: left;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  .panel button[aria-pressed="true"] {
    background: #2b6cb0;
    color: #fff;
    border-color: #2b6cb0;
  }

  /* UNopenGIS/7#1012 の回避策本体。
     出典: https://github.com/maplibre/maplibre-gl-js/issues/5259#issuecomment-3510571607
     bvmap-spacegray.json 側で text-font: ["Choonpu"] を指定している3レイヤー
     (縦書き注記)がこのフォントを解決できるよう、ページ側で用意する。 */
  @font-face {
    font-family: "Choonpu";
    src: local("Hiragino Mincho ProN"), local("Noto Serif CJK JP"), local("MS Mincho");
    font-feature-settings: "vert";
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="style-panel">
  <button data-style="../style/bvmap-dark.json" aria-pressed="true">bvmap-dark(無加工)</button>
  <button data-style="../style/bvmap-spacegray.json" aria-pressed="false">bvmap-spacegray(要CSS)</button>
</div>
<script type="module">
// zukaku (docs/index.html) と同じCDN参照。手元でこのファイルを開いて
// CDNからのスクリプト読み込みがブロックされる環境(例: サンドボックス化
// されたブラウザ)では、examples/vendor/ にローカルへ退避して
// "./vendor/maplibre-gl.mjs" 等に差し替えるとよい(vendor/はgitignore対象)。
import { Map as MapLibreMap, NavigationControl } from "https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";

  // issue #1012 の再現条件と同じ地点(旭川、縦書き注記に「ー」を含む)
  const map = new MapLibreMap({
    container: "map",
    style: "../style/bvmap-dark.json",
    center: [142.365, 43.7706],
    zoom: 15,
    hash: true,
  });
  map.addControl(new NavigationControl());
  window.__map = map; // debugging aid

  const panel = document.getElementById("style-panel");
  panel.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-style]");
    if (!btn) return;
    map.setStyle(btn.dataset.style);
    for (const b of panel.querySelectorAll("button")) {
      b.setAttribute("aria-pressed", String(b === btn));
    }
  });
</script>
</body>
</html>
