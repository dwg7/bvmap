<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bvmap style preview</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute;
    z-index: 10;
    top: 12px;
    left: 12px;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.6;
  }
  .panel button {
    display: block;
    width: 100%;
    margin: 2px 0;
    padding: 4px 10px;
    text-align: left;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  .panel button[aria-pressed="true"] {
    background: #2b6cb0;
    color: #fff;
    border-color: #2b6cb0;
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="style-panel">
  <button data-style="../style/bvmap-dark.json" aria-pressed="true">bvmap-dark</button>
  <button data-style="../style/bvmap-starlight.json" aria-pressed="false">bvmap-starlight</button>
</div>
<script type="module">
// zukaku (docs/index.html) と同じCDN参照。CDNからのスクリプト読み込みが
// ブロックされる環境(例: サンドボックス化されたブラウザ)では、
// examples/vendor/ にローカルへ退避して "./vendor/maplibre-gl.mjs" 等に
// 差し替えるとよい(vendor/はgitignore対象)。
import { Map as MapLibreMap, NavigationControl } from "https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";

  const map = new MapLibreMap({
    container: "map",
    style: "../style/bvmap-dark.json",
    center: [141.36108, 43.061529], // 札幌
    zoom: 16,
    hash: true,
  });
  map.addControl(new NavigationControl());
  window.__map = map; // debugging aid

  let currentStyleURL = "../style/bvmap-dark.json";

  const panel = document.getElementById("style-panel");
  panel.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-style]");
    if (!btn) return;
    const url = btn.dataset.style;
    if (url === currentStyleURL) return;
    // diff:false forces a full style replacement. bvmap-dark.json/
    // bvmap-starlight.json share the same 123 layer ids/order by design
    // (the generator's structural gate), and MapLibre's default diff:true
    // path tries a fine-grained update instead of a full teardown for that
    // case — worth avoiding since it touches style-wide properties
    // (sprite, glyphs), not just per-layer paint.
    //
    // Two heavier alternatives were tried and reverted: (1) diff:false
    // plus a "switching" flag gated on the new style's "idle" event, which
    // gets stuck true forever if "idle" never fires — every later click
    // silently does nothing; (2) tearing down and recreating the whole Map
    // (and its WebGL context) on every switch, which sidesteps MapLibre's
    // internal setStyle state entirely but risks exhausting the browser's
    // WebGL context budget after many switches in one session (observed
    // during testing: the map stopped rendering until a full page reload).
    // Plain setStyle(url, {diff:false}) with no extra state is the
    // smallest change with the fewest new failure modes.
    map.setStyle(url, { diff: false });
    currentStyleURL = url;
    for (const b of panel.querySelectorAll("button")) {
      b.setAttribute("aria-pressed", String(b === btn));
    }
  });
</script>
</body>
</html>
