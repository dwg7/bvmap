<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bvmap style preview</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute;
    z-index: 10;
    top: 12px;
    left: 12px;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.6;
  }
  .panel button {
    display: block;
    width: 100%;
    margin: 2px 0;
    padding: 4px 10px;
    text-align: left;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  .panel button[aria-pressed="true"] {
    background: #2b6cb0;
    color: #fff;
    border-color: #2b6cb0;
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="style-panel">
  <button data-style="../style/bvmap-dark.json" aria-pressed="true">bvmap-dark</button>
  <button data-style="../style/bvmap-starlight.json" aria-pressed="false">bvmap-starlight</button>
</div>
<script type="module">
// zukaku (docs/index.html) と同じCDN参照。CDNからのスクリプト読み込みが
// ブロックされる環境(例: サンドボックス化されたブラウザ)では、
// examples/vendor/ にローカルへ退避して "./vendor/maplibre-gl.mjs" 等に
// 差し替えるとよい(vendor/はgitignore対象)。
import { Map as MapLibreMap, NavigationControl } from "https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";

  const map = new MapLibreMap({
    container: "map",
    style: "../style/bvmap-dark.json",
    center: [141.36108, 43.061529], // 札幌
    zoom: 16,
    hash: true,
  });
  map.addControl(new NavigationControl());
  window.__map = map; // debugging aid

  let currentStyleURL = "../style/bvmap-dark.json";
  let switching = false;

  const panel = document.getElementById("style-panel");
  panel.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-style]");
    if (!btn) return;
    const url = btn.dataset.style;
    // Guard against MapLibre's default diff:true setStyle path, and against
    // overlapping calls: bvmap-dark.json/bvmap-starlight.json share the same
    // 123 layer ids/order by design (the generator's structural gate), so
    // MapLibre's diff tries a fine-grained update (including the sprite/
    // glyphs URLs) instead of a full teardown — that path has been
    // unreliable here (switching silently stops taking effect after a few
    // clicks). diff:false forces a full style replacement every time, and
    // ignoring clicks while one is still in flight avoids queuing a second
    // setStyle before the first has settled.
    if (switching || url === currentStyleURL) return;
    switching = true;
    map.once("idle", () => { switching = false; });
    map.setStyle(url, { diff: false });
    currentStyleURL = url;
    for (const b of panel.querySelectorAll("button")) {
      b.setAttribute("aria-pressed", String(b === btn));
    }
  });
</script>
</body>
</html>
