<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>nightsky compare</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<style>html,body{margin:0;height:100%;font:12px system-ui}
.m{position:absolute;top:0;bottom:0;width:50%}#l{left:0}#r{right:0}
.t{position:absolute;z-index:5;top:6px;background:#fffd;padding:2px 6px;border-radius:4px}</style></head>
<body><div id="l" class="m"></div><div id="r" class="m"></div>
<div class="t" style="left:6px" id="tl"></div><div class="t" style="right:6px" id="tr"></div>
<script type="module">
// Prototype viewer (docs/decisions/0043). Serve the repo root:  python3 -m http.server 8765
// URL: /experiments/nightsky/compare.html?left=style/bvmap-starlight.json&right=experiments/nightsky/out/mechanical.json#zoom/lat/lng
// Sprite is redirected to the local sprite dir given by ?sprite= (default: the style's own).
import { Map as M } from "https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";
const q = new URLSearchParams(location.search);
const m = location.hash.match(/^#(-?[\d.]+)\/(-?[\d.]+)\/(-?[\d.]+)/);
const cam = m ? { zoom: +m[1], center: [+m[3], +m[2]] } : { zoom: 15, center: [139.7671, 35.6812] };
async function load(path, sprite) {
  const s = await (await fetch("/" + path)).json();
  if (sprite) s.sprite = location.origin + "/" + sprite;
  return s;
}
const L = q.get("left") || "style/bvmap-starlight.json", R = q.get("right") || "experiments/nightsky/out/mechanical.json";
document.getElementById("tl").textContent = L; document.getElementById("tr").textContent = R;
const l = new M({ container: "l", style: await load(L), ...cam });
const r = new M({ container: "r", style: await load(R, q.get("sprite")), ...cam });
let busy = false;
for (const [a, b] of [[l, r], [r, l]]) a.on("move", () => { if (busy) return; busy = true; b.jumpTo({ center: a.getCenter(), zoom: a.getZoom() }); busy = false; });
window.__l = l; window.__r = r;
</script></body></html>
